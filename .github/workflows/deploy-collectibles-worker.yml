name: Deploy Collectibles Worker

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/deploy-collectibles-worker.yml"
      - "workers/collectibles/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-collectibles-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Deploy Collectibles worker
        run: npx wrangler deploy --config workers/collectibles/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
