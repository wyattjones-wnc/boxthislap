name: Deploy Fantasy Office Worker

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply reviewed pending Fantasy Office migrations before deploying
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-fantasy-office-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:fantasy-office
      - name: Apply reviewed Fantasy Office migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply formula-one --remote --config workers/fantasy-office/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Fantasy Office Worker
        run: npx wrangler deploy --config workers/fantasy-office/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
