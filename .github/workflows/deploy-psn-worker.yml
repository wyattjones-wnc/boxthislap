name: Deploy PSN Trophy Worker

on:
  push:
    branches: [dev]
    paths:
      - workers/psn-trophies/**
      - .github/workflows/deploy-psn-worker.yml
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 migrations after a reviewed usage estimate"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-psn-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:psn
      - run: npm run check:psn
      - name: Apply PSN migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply psn-trophies --remote --config workers/psn-trophies/wrangler.toml
      - name: Deploy PSN worker
        run: npx wrangler deploy --config workers/psn-trophies/wrangler.toml
      - name: Verify platinum numbering
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        run: npx wrangler d1 execute psn-trophies --remote --config workers/psn-trophies/wrangler.toml --command "SELECT COUNT(*) AS earned_platinums, MAX(platinum_number) AS latest_platinum_number FROM trophies WHERE earned = 1 AND earned_at IS NOT NULL AND trophy_type = 'platinum';"
