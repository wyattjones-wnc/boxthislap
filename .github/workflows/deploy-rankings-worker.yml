name: Deploy Rankings Worker

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-rankings-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Apply Rankings migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply rankings --remote --config workers/rankings/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Rankings worker
        run: npx wrangler deploy --config workers/rankings/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
