name: Deploy YouTube Inbox Worker

on:
  push:
    branches: [dev]
    paths:
      - workers/youtube-inbox/**
      - modules/youtubeInbox.js
      - .github/workflows/deploy-youtube-inbox-worker.yml
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations after explicit usage approval
        required: true
        type: boolean
        default: false
      usage_review:
        description: Approved usage estimate and scope (required for migrations)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-youtube-inbox-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      USAGE_REVIEW: ${{ inputs.usage_review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:youtube
      - name: Validate migration usage approval
        if: ${{ inputs.apply_migrations }}
        run: |
          test -n "$USAGE_REVIEW" || { echo "A reviewed, explicitly approved usage estimate is required."; exit 1; }
          printf '%s\n' "$USAGE_REVIEW" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply approved YouTube migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply youtube-inbox --remote --config workers/youtube-inbox/wrangler.toml --env=""
      - name: Verify required feed indexes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npx wrangler d1 execute youtube-inbox --remote --config workers/youtube-inbox/wrangler.toml --env="" --json --command="SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('idx_videos_status_published', 'idx_videos_channel_status_published', 'idx_videos_published')" > /tmp/youtube-indexes.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/youtube-indexes.json', 'utf8'));
          const names = new Set(result.flatMap((query) => query.results || []).map((row) => row.name));
          for (const name of ['idx_videos_status_published', 'idx_videos_channel_status_published', 'idx_videos_published']) {
            if (!names.has(name)) throw new Error(`Missing required index: ${name}`);
          }
          JS
      - name: Deploy YouTube Worker
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx wrangler deploy --config workers/youtube-inbox/wrangler.toml --env=""
      - name: Verify Worker health
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: curl --fail --silent --show-error https://box-this-lap-youtube.boxthislap.workers.dev/health
