name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            dev-site/package-lock.json

      - name: Build combined site
        run: |
          mkdir -p _site

          if node -e "const pkg=require('./main-site/package.json'); process.exit(pkg.scripts?.build ? 0 : 1)"; then
            npm --prefix main-site ci
            npm --prefix main-site run build
            rsync -a main-site/dist/ _site/
          else
            rsync -a --exclude='.git' --exclude='.github' main-site/ _site/
          fi

          mkdir -p _site/dev

          if node -e "const pkg=require('./dev-site/package.json'); process.exit(pkg.scripts?.build ? 0 : 1)"; then
            npm --prefix dev-site ci
            npm --prefix dev-site run build
            rsync -a dev-site/dist/ _site/dev/
          else
            rsync -a --exclude='.git' --exclude='.github' dev-site/ _site/dev/
          fi

          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const html = readFileSync("_site/dev/index.html", "utf8");
          if (!/\.\/build\/index-[^"']+\.js/.test(html)) {
            throw new Error("The dev Pages artifact does not reference the compiled Vite entrypoint.");
          }
          NODE

          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          CACHE_VERSION="$(echo "$VERSION" | tr -cd '0-9')"
          export VERSION CACHE_VERSION
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          cache_version = os.environ["CACHE_VERSION"]

          for index_path in (pathlib.Path("_site/index.html"), pathlib.Path("_site/dev/index.html")):
              if not index_path.exists():
                  continue

              html = index_path.read_text(encoding="utf-8")
              html = re.sub(
                  r'window\.BOX_THIS_LAP_VERSION = "[^"]+";',
                  f'window.BOX_THIS_LAP_VERSION = "{version}";',
                  html,
              )
              html = re.sub(r'styles\.css\?v=\d+', f'styles.css?v={cache_version}', html)
              html = re.sub(r'script\.js\?v=\d+', f'script.js?v={cache_version}', html)
              index_path.write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
