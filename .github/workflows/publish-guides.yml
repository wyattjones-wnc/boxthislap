name: Publish Guides

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-guides-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate Guides snapshot
        run: node scripts/generate-guides-data.mjs

      - name: Commit changed snapshot
        id: commit-guides
        run: |
          if git diff --quiet -- data/guides.json; then
            echo "Guide snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guides.json
          git commit -m "Publish guide data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy changed snapshot
        if: steps.commit-guides.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
