name: Update Collectibles Catalog

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/update-collectibles-catalog.yml"
      - "scripts/collectibles/**"
      - "!scripts/collectibles/**/*.test.mjs"
      - "workers/collectibles/migrations/**"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-collectibles-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate static catalog snapshot
        run: npm run collectibles:sync -- --snapshot-only

      - name: Apply catalog schema
        id: d1_schema
        continue-on-error: true
        run: npx wrangler d1 migrations apply rankings --remote --config workers/collectibles/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync source catalog
        if: steps.d1_schema.outcome == 'success'
        continue-on-error: true
        run: npm run collectibles:sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Publish static catalog snapshot
        id: commit_snapshot
        if: always()
        run: |
          if git diff --quiet -- data/collectibles-catalog.json; then
            echo "No catalog snapshot changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collectibles-catalog.json
          git commit -m "Update collectibles catalog snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy changed snapshot
        if: always() && steps.commit_snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
