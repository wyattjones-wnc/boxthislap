name: Update Fantasy Office data (manual fallback)

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      movie_limit:
        description: "Maximum movies to update (0 updates the whole season)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: update-fantasy-office-data
  cancel-in-progress: false

jobs:
  update:
    # The Worker owns six-hour automatic updates. Scheduled Actions stay opt-in
    # to avoid running a second collector against the same season.
    if: github.event_name == 'workflow_dispatch' || vars.FANTASY_OFFICE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and ingest movie data
        id: update
        continue-on-error: true
        env:
          FANTASY_OFFICE_SYNC_SECRET: ${{ secrets.FANTASY_OFFICE_SYNC_SECRET }}
          FANTASY_OFFICE_MOVIE_LIMIT: ${{ inputs.movie_limit || '0' }}
        run: node scripts/update-fantasy-office-data.mjs
      - name: Retain failed source responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-office-update-${{ github.run_id }}
          path: |
            .tmp/fantasy-office-report.json
            .tmp/fantasy-office-debug/
          if-no-files-found: ignore
          retention-days: 14
      - name: Update incident issue
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.movie_limit == '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-fantasy-office-failure.mjs
      - name: Fail execution errors
        if: steps.update.outcome == 'failure'
        run: exit 1
