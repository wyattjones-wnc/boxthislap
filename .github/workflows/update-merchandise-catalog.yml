name: Update Merchandise Catalog

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan stores without writing D1
        required: false
        default: true
        type: boolean
      sources:
        description: Comma-separated stores to scan
        required: false
        default: arsenal,barcelona
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: update-merchandise-catalog
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.MERCHANDISE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan and import merchandise
        id: update
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MERCHANDISE_D1_DATABASE_ID: ${{ secrets.MERCHANDISE_D1_DATABASE_ID }}
          MERCHANDISE_SOURCES: ${{ (github.event_name == 'workflow_dispatch' && inputs.sources) || vars.MERCHANDISE_SOURCES || 'barcelona' }}
        run: node scripts/update-merchandise-data.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Retain scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchandise-update-${{ github.run_id }}
          path: .tmp/merchandise-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Update incident issue
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-merchandise-failure.mjs
      - name: Fail unhealthy run
        if: steps.update.outcome == 'failure'
        run: exit 1
