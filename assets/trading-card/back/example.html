<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Card Reverse</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<article class="card">
  <img class="shell" src="card-shell.svg" alt="">
  <div class="rail-wrap">
    <img class="rail" src="left-rail.svg" alt="">
    <div class="rail-text" data-team-name>Arsenal Football Club</div>
    <img class="rail-logo" data-team-logo src="team-logo.svg" alt="">
  </div>
  <img class="stripes" src="bottom-stripes.svg" alt="">

  <section class="content">
    <header class="player-header">
      <div>
        <h1>David<br>Raya</h1>
        <div class="position">Goalkeeper</div>
      </div>
      <div class="badges">
        <img src="badge-new-player.svg" alt="New player">
        <div class="academy-badge-wrap">
          <img class="academy-badge-frame" src="badge-academy-product.svg" alt="Academy product">
          <img class="academy-badge-logo" data-team-logo src="team-logo.svg" alt="">
        </div>
      </div>
    </header>

    <div class="divider"></div>

    <dl class="facts">
      <div class="fact">
        <img src="icon-appearances-stadium.svg" alt="">
        <div><dt>Appearances</dt><dd>00</dd></div>
      </div>
      <div class="fact">
        <img src="icon-year-joined.svg" alt="">
        <div><dt>Year joined</dt><dd>2023</dd></div>
      </div>
      <div class="fact">
        <img src="icon-club-joined-from.svg" alt="">
        <div><dt>Club joined from</dt><dd>Brentford</dd></div>
      </div>
      <div class="fact">
        <img src="icon-home-country.svg" alt="">
        <div><dt>Home country</dt><dd>Spain</dd></div>
      </div>
      <div class="fact">
        <img src="icon-birthday.svg" alt="">
        <div><dt>Birthday</dt><dd>15 Sep 1995</dd></div>
      </div>
    </dl>
  </section>
</article>
</body>
</html>
