        document.documentElement.dataset.theme = localStorage.getItem("boxThisLapTheme") || "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <script>
      (() => {
        let isShellReady = false;
        let staleTimer = null;
        let startY = 0;
        let pullDistance = 0;
        let isTrackingPull = false;
        const refreshThreshold = 72;
        const staleResumeThreshold = 10 * 60 * 1000;
        let hiddenAt = 0;

        function hardRefresh() {
          const url = new URL(window.location.href);
          url.searchParams.set("refresh", Date.now().toString());
          window.location.replace(url.toString());
        }

        function clearRefreshParam() {
          const url = new URL(window.location.href);

          if (!url.searchParams.has("refresh")) {
            return;
          }

          url.searchParams.delete("refresh");
          window.history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
        }

        function showStaleWarning() {
          if (isShellReady || !document.body) {
            return;
          }

          document.body.classList.remove("is-routing");
          document.body.classList.add("has-shell-stale-warning");
        }

        function refreshIfStaleResume() {
          if (!hiddenAt) {
            return;
          }

          const hiddenDuration = Date.now() - hiddenAt;
          hiddenAt = 0;

          if (hiddenDuration >= staleResumeThreshold) {
            hardRefresh();
          }
        }

        function setPullDistance(value) {
          pullDistance = Math.max(0, value);
          document.documentElement.style.setProperty("--pull-refresh-distance", `${pullDistance}px`);
          document.body?.classList.toggle("is-pulling-refresh", pullDistance > 0);
          document.body?.classList.toggle("is-pull-ready", pullDistance >= refreshThreshold);
        }

        function stopTrackingPull() {
          isTrackingPull = false;
          setPullDistance(0);
        }

        function hasOpenDialog() {
          return Boolean(document.querySelector("dialog[open]"));
        }

        window.boxThisLapHardRefresh = hardRefresh;
        window.boxThisLapMarkReady = () => {
          isShellReady = true;
          clearTimeout(staleTimer);
          document.body?.classList.remove("is-routing");
          document.body?.classList.remove("has-shell-stale-warning");
          clearRefreshParam();
        };

        function isCriticalShellResource(target) {
          if (target instanceof HTMLScriptElement) {
            return target.src.includes("script.js");
          }

          if (target instanceof HTMLLinkElement) {
            return target.rel === "stylesheet";
          }

          return false;
        }

        window.addEventListener("error", (event) => {
          const target = event.target;

          if (isCriticalShellResource(target)) {
            showStaleWarning();
          }
        }, true);

        window.addEventListener("pagehide", () => {
          hiddenAt = Date.now();
        });

        window.addEventListener("pageshow", (event) => {
          if (event.persisted) {
            refreshIfStaleResume();
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            hiddenAt = Date.now();
            return;
          }

          refreshIfStaleResume();
        });

        window.addEventListener("online", () => {
          if (document.body?.classList.contains("has-shell-stale-warning")) {
            hardRefresh();
          }
        });

        document.addEventListener("DOMContentLoaded", () => {
          staleTimer = window.setTimeout(showStaleWarning, 4500);
          window.setTimeout(() => window.boxThisLapMarkReady?.(), 0);

          document.querySelector("[data-hard-refresh]")?.addEventListener("click", hardRefresh);

          document.addEventListener("touchstart", (event) => {
            if (hasOpenDialog() || event.touches.length !== 1 || window.scrollY > 0) {
              stopTrackingPull();
              return;
            }

            isTrackingPull = true;
            startY = event.touches[0].clientY;
          }, { passive: true });

          document.addEventListener("touchmove", (event) => {
            if (hasOpenDialog()) {
              stopTrackingPull();
              return;
            }

            if (!isTrackingPull || event.touches.length !== 1) {
              return;
            }

            const delta = event.touches[0].clientY - startY;

            if (delta <= 0 || window.scrollY > 0) {
              setPullDistance(0);
              return;
            }

            setPullDistance(Math.min(120, delta * 0.5));

            if (pullDistance > 8) {
              event.preventDefault();
            }
          }, { passive: false });

          document.addEventListener("touchend", () => {
            if (hasOpenDialog()) {
              stopTrackingPull();
              return;
            }

            if (!isTrackingPull) {
              return;
            }

            isTrackingPull = false;

            if (pullDistance >= refreshThreshold) {
              hardRefresh();
              return;
            }

            setPullDistance(0);
          }, { passive: true });
        });
      })();
    </script>
