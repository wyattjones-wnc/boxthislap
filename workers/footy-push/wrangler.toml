[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "FOOTY_PUSH_KV"
id = "18bc15da284647deb5eda7baf59a0cd9"
preview_id = "a79f07809e6149a4901e75bddbd3310b"

[[d1_databases]]
binding = "DB"
database_name = "rankings"
database_id = "45c405ab-a0cd-442a-b135-b7ffe4b7d933"

[[d1_databases]]
