name = "box-this-lap-image-library"
main = "src/index.js"
compatibility_date = "2026-10-08"

[vars]
ALLOWED_ORIGINS = "https://wyattjones-wnc.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173"
ADMIN_MANAGER_IDS = "6"

[[services]]
binding = "MANAGER_AUTH"
service = "box-this-lap-rankings"

[[d1_databases]]
binding = "DB"
database_name = "footy-match-notes"
database_id = "af010919-5364-4324-8b89-72c832c215ed"
migrations_dir = "../footy-notes/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "box-this-lap-image-library"

[[durable_objects.bindings]]
name = "MEDIA_BUDGET"
class_name = "MediaBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MediaBudget"]

[[r2_buckets]]
binding = "ROSTER_MEDIA"
bucket_name = "box-this-lap-footy-roster-media"

[[r2_buckets]]
binding = "MATCH_MEDIA"
bucket_name = "box-this-lap-footy-match-media"
