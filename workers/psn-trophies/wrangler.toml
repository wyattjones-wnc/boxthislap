name = "box-this-lap-psn"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[vars]
ALLOWED_ORIGINS = "https://wyattjones-wnc.github.io,http://localhost:8000,http://127.0.0.1:8000"
PSN_ACCOUNT_ID = "me"
ADMIN_MANAGER_IDS = "6"

[[services]]
binding = "MANAGER_AUTH"
service = "box-this-lap-rankings"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "psn-trophies"
database_id = "abcb147f-099a-470d-9774-0c5a8a679b27"
migrations_dir = "migrations"

[observability]
enabled = true
